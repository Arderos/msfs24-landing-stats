name: msfs-landing-telemetry

services:
  telemetry-api:
    build:
      context: .
    image: msfs-landing-telemetry-api:local
    restart: unless-stopped
    environment:
      DATA_ROOT: /data
      REGISTRATION_MODE: ${REGISTRATION_MODE:-invite}
      SERVER_PEPPER_FILE: /run/secrets/server_pepper
      MAX_UPLOAD_BYTES: "16777216"
      MAX_UNCOMPRESSED_BYTES: "67108864"
      STORAGE_QUOTA_BYTES: "21474836480"
      DAILY_INSTALL_QUOTA_BYTES: "536870912"
      DAILY_SOURCE_ATTEMPT_QUOTA_BYTES: "1073741824"
      DAILY_GLOBAL_ATTEMPT_QUOTA_BYTES: "4294967296"
      MINIMUM_FREE_BYTES: "2147483648"
      RETENTION_DAYS: "30"
    volumes:
      - /srv/msfs-landing-telemetry/data:/data
    secrets:
      - server_pepper
    networks:
      - ingress
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  cloudflared:
    image: cloudflare/cloudflared:latest@sha256:e39ee8da81ad5e05d77f38d2f51c60ca51bf2a8450ac3abab50c17fdb91d91bf
    restart: unless-stopped
    depends_on:
      telemetry-api:
        condition: service_healthy
    command:
      - tunnel
      - --no-autoupdate
      - --metrics
      - 0.0.0.0:2000
      - run
      - --token-file
      - /run/secrets/cloudflared_token
    secrets:
      - cloudflared_token
    networks:
      - ingress
      - egress
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 128m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  ingress:
    internal: true
  egress:

secrets:
  cloudflared_token:
    file: ./secrets/cloudflared-token
  server_pepper:
    file: ./secrets/server-pepper
