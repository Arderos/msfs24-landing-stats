name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      sign:
        description: 'Build and test with the real code-signing certificate (does not publish a release)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    environment: ${{ (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.sign)) && 'code-signing' || 'build' }}
    concurrency:
      group: ${{ (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.sign)) && 'certum-code-signing' || format('build-{0}', github.run_id) }}
      cancel-in-progress: false

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: 10.0.x

      - name: Check signing configuration and verify Certum installer
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.sign)
        shell: pwsh
        env:
          CERTUM_USERNAME: ${{ secrets.CERTUM_USERNAME }}
          CERTUM_OTP_URI: ${{ secrets.CERTUM_OTP_URI }}
          CERTUM_KEY_ID: ${{ secrets.CERTUM_KEY_ID }}
        run: |
          foreach ($name in @('CERTUM_USERNAME','CERTUM_OTP_URI','CERTUM_KEY_ID')) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              throw "Required code-signing secret is missing: $name"
            }
          }
          $url = 'https://files.certum.eu/software/SimplySignDesktop/Windows/9.4.3.90/SimplySignDesktop-9.4.3.90-64-bit-en.msi'
          Invoke-WebRequest $url -OutFile SimplySignDesktop.msi
          if ((Get-FileHash SimplySignDesktop.msi).Hash -ne 'CE2B38EF0124A574BC08E5558726099CAAC79A7C58B8D3D712F629371FE1BCB7') {
            throw 'Certum installer checksum mismatch.'
          }
          if ((Get-AuthenticodeSignature SimplySignDesktop.msi).Status -ne 'Valid') {
            throw 'Certum installer signature is invalid.'
          }

      - name: Connect Certum cloud certificate
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.sign)
        # Reviewed, pinned code. Never use a mutable branch for an action with signing credentials.
        uses: dismine/windows-app-signing-setup-action@89ae3b032d4bc7a5b98d1a42a34e61ecb6faad64
        with:
          certum-username: ${{ secrets.CERTUM_USERNAME }}
          certum-otp-uri: ${{ secrets.CERTUM_OTP_URI }}
          certum-key-id: ${{ secrets.CERTUM_KEY_ID }}
          capture-diagnostics: 'false'

      - name: Select pinned MSFS 2024 SDK
        id: sdk
        shell: pwsh
        run: |
          "version=1.8.1" >> $env:GITHUB_OUTPUT
          "download_url=https://sdk.flightsimulator.com/msfs2024/files/installers/1.8.1/MSFS2024_SDK_Core_Installer_1.8.1.zip" >> $env:GITHUB_OUTPUT

      - name: Cache SimConnect SDK
        id: sdk-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}\msfs-simconnect-sdk
          key: msfs2024-simconnect-${{ steps.sdk.outputs.version }}

      - name: Download and extract SimConnect SDK
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        shell: pwsh
        env:
          SDK_DOWNLOAD_URL: ${{ steps.sdk.outputs.download_url }}
        run: |
          $archivePath = Join-Path $env:RUNNER_TEMP "msfs2024-sdk.zip"
          $installerDirectory = Join-Path $env:RUNNER_TEMP "msfs2024-sdk-installer"
          $adminDirectory = Join-Path $env:RUNNER_TEMP "msfs2024-sdk-admin"
          $targetRoot = Join-Path $env:RUNNER_TEMP "msfs-simconnect-sdk"

          Invoke-WebRequest -Uri $env:SDK_DOWNLOAD_URL -OutFile $archivePath
          if ((Get-FileHash $archivePath -Algorithm SHA256).Hash -ne '7e7cd4774f3cb47e2942960e17b19b0a553499b2bab23da4851127a2363b8750') {
            throw 'Pinned MSFS SDK archive checksum mismatch.'
          }
          Expand-Archive -LiteralPath $archivePath -DestinationPath $installerDirectory
          $msi = Get-ChildItem $installerDirectory -Recurse -Filter '*.msi' | Select-Object -First 1
          if ($null -eq $msi) {
            throw "The MSFS 2024 SDK archive did not contain an MSI installer."
          }

          $arguments = @(
            '/a',
            "`"$($msi.FullName)`"",
            '/qn',
            "TARGETDIR=`"$adminDirectory`"",
            'REBOOT=ReallySuppress'
          )
          $installer = Start-Process -FilePath 'msiexec.exe' -ArgumentList $arguments -Wait -PassThru -WindowStyle Hidden
          if ($installer.ExitCode -ne 0) {
            throw "MSFS 2024 SDK administrative extraction failed with exit code $($installer.ExitCode)."
          }

          $managed = Get-ChildItem $adminDirectory -Recurse -Filter 'Microsoft.FlightSimulator.SimConnect.dll' |
            Where-Object { $_.FullName -match '[\\/]managed[\\/]' } |
            Select-Object -First 1
          $native = Get-ChildItem $adminDirectory -Recurse -Filter 'SimConnect.dll' |
            Where-Object { $_.FullName -notmatch '[\\/]managed[\\/]' } |
            Select-Object -First 1
          if ($null -eq $managed -or $null -eq $native) {
            throw "The extracted SDK did not contain both managed and native SimConnect libraries."
          }

          $managedTarget = Join-Path $targetRoot 'SimConnect SDK\lib\managed'
          $nativeTarget = Join-Path $targetRoot 'SimConnect SDK\lib'
          New-Item -ItemType Directory -Force -Path $managedTarget | Out-Null
          New-Item -ItemType Directory -Force -Path $nativeTarget | Out-Null
          Copy-Item -LiteralPath $managed.FullName -Destination $managedTarget
          Copy-Item -LiteralPath $native.FullName -Destination $nativeTarget

      - name: Verify pinned SimConnect libraries including cache hits
        shell: pwsh
        run: |
          $sdk = Join-Path $env:RUNNER_TEMP 'msfs-simconnect-sdk\SimConnect SDK\lib'
          if ((Get-FileHash (Join-Path $sdk 'SimConnect.dll')).Hash -ne '5cd1ddc2e6ece8c36ce47d3a953a776f012cc13ebee17b263088f05f98568323' -or
              (Get-FileHash (Join-Path $sdk 'managed\Microsoft.FlightSimulator.SimConnect.dll')).Hash -ne '424a9e5085ed7f58f08e078ad5933eed1bc1560df492a9d3c3777befb1c9006f') {
            throw 'Pinned SimConnect libraries differ.'
          }

      - name: Build single executable and updater
        shell: pwsh
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ github.event_name != 'pull_request' && secrets.GOOGLE_OAUTH_CLIENT_ID || '' }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ github.event_name != 'pull_request' && secrets.GOOGLE_OAUTH_CLIENT_SECRET || '' }}
          SIGN_BUILD: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.sign) }}
          CERTUM_KEY_ID: ${{ secrets.CERTUM_KEY_ID }}
        run: |
          $arguments = @{
            MsfsSdkRoot = Join-Path $env:RUNNER_TEMP 'msfs-simconnect-sdk'
          }
          if ('${{ github.event_name }}' -eq 'pull_request') {
            $arguments.AllowMissingGoogleOAuthCredentials = $true
          }
          if ($env:SIGN_BUILD -eq 'true') {
            $tool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe' |
              Sort-Object FullName -Descending | Select-Object -First 1
            if ($null -eq $tool) { throw 'SignTool was not found.' }
            $arguments.SignToolPath = $tool.FullName
            $arguments.SigningCertificateThumbprint = $env:CERTUM_KEY_ID
          }
          .\build-app.ps1 @arguments

      - name: Run regression tests
        shell: pwsh
        run: |
          $fixtures = Join-Path $env:GITHUB_WORKSPACE 'artifacts\receiver-contract'
          New-Item -ItemType Directory -Path $fixtures -Force | Out-Null
          foreach ($kind in @('ARCHIVE','PROVENANCE','SOURCE')) {
            $path = Join-Path $fixtures ($kind.ToLowerInvariant() + '.zip')
            [Environment]::SetEnvironmentVariable("MSFSLS_${kind}_FIXTURE", $path)
            "MSFSLS_${kind}_FIXTURE=$path" >> $env:GITHUB_ENV
          }
          & .\tests\LandingStats.App.RegressionTests\bin\Release\net48\LandingStats.App.RegressionTests.exe
          if ($LASTEXITCODE -ne 0) { throw 'Application regressions failed.' }
          foreach ($kind in @('ARCHIVE','PROVENANCE','SOURCE')) {
            if (-not (Test-Path -LiteralPath ([Environment]::GetEnvironmentVariable("MSFSLS_${kind}_FIXTURE")) -PathType Leaf)) {
              throw "Required receiver contract fixture was not emitted: $kind"
            }
          }
          & .\tests\LandingStats.Archives.RegressionTests\bin\Release\net48\LandingStats.Archives.RegressionTests.exe
          if ($LASTEXITCODE -ne 0) { throw 'net48 capture archive regressions failed.' }
          dotnet .\tests\LandingStats.Archives.RegressionTests\bin\Release\net10.0\LandingStats.Archives.RegressionTests.dll
          if ($LASTEXITCODE -ne 0) { throw 'net10 capture archive regressions failed.' }
          & .\tests\LandingStats.Runtime.RegressionTests\bin\Release\net48\LandingStats.Runtime.RegressionTests.exe
          if ($LASTEXITCODE -ne 0) { throw 'net48 runtime IPC regressions failed.' }
          dotnet .\tests\LandingStats.Runtime.RegressionTests\bin\Release\net10.0\LandingStats.Runtime.RegressionTests.dll
          if ($LASTEXITCODE -ne 0) { throw 'net10 runtime IPC regressions failed.' }

      - name: Set up Python for cross-language archive contract
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Verify real C# writer output with Python reader
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check -r server/telemetry-ingest/requirements-test.txt
          if ($LASTEXITCODE -ne 0) { throw 'Python contract dependencies failed.' }
          & .\tests\LandingStats.Archives.RegressionTests\bin\Release\net48\LandingStats.Archives.RegressionTests.exe --emit-fixtures artifacts\archive-contract-net48
          if ($LASTEXITCODE -ne 0) { throw 'net48 fixture writer failed.' }
          dotnet .\tests\LandingStats.Archives.RegressionTests\bin\Release\net10.0\LandingStats.Archives.RegressionTests.dll --emit-fixtures artifacts\archive-contract-net10
          if ($LASTEXITCODE -ne 0) { throw 'net10 fixture writer failed.' }
          foreach ($framework in @('net48', 'net10')) {
            python server/telemetry-ingest/tests/verify_dotnet_archives.py "artifacts/archive-contract-$framework"
            if ($LASTEXITCODE -ne 0) { throw "Python reader failed for $framework writer." }
          }
          Push-Location server/telemetry-ingest
          try {
            python -m unittest discover -s tests -p 'test_*.py'
            if ($LASTEXITCODE -ne 0) { throw 'Receiver rejected a real C# report or another server regression failed.' }
          } finally { Pop-Location }

      - name: Test signed and unsigned bundle layouts
        shell: pwsh
        run: .\tests\BundlePayload.Tests.ps1

      - name: Test Google Drive package configuration guard
        shell: pwsh
        run: .\tests\GoogleOAuthBuildGuard.Tests.ps1

      - name: Verify guardian worker bundle topology
        shell: pwsh
        run: .\tests\GuardianBundle.Tests.ps1 -PackagePath .\artifacts\MSFS-Landing-Stats.exe

      - name: Run update compatibility gate tests
        shell: pwsh
        run: |
          & .\tests\UpdateCompatibility.Tests.ps1 -ArtifactsDirectory .\artifacts

      - name: Verify signatures and launch the signed application
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.sign)
        shell: pwsh
        env:
          CERTUM_KEY_ID: ${{ secrets.CERTUM_KEY_ID }}
        run: .\verify-authenticode-build.ps1 -CertificateThumbprint $env:CERTUM_KEY_ID -LaunchOnHostedRunner

      - name: Sign update metadata
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.sign)
        shell: pwsh
        env:
          RELEASE_SIGNING_KEY_PKCS8_B64: ${{ secrets.RELEASE_SIGNING_KEY_PKCS8_B64 }}
        run: |
          .\sign-update-manifest.ps1

      - name: Test every published client without signing credentials
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.sign)
        shell: pwsh
        run: .\verify-published-client-updates.ps1

      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: MSFS-Landing-Stats
          path: |
            artifacts/MSFS-Landing-Stats.exe
            artifacts/MSFS-Landing-Stats.Updater.exe
            artifacts/update-channel.txt
            artifacts/update-channel.sig
            artifacts/update-manifest.txt
            artifacts/update-manifest.sig
          if-no-files-found: error

  server:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/telemetry-ingest/requirements-test.txt

      - name: Install telemetry server dependencies
        working-directory: server/telemetry-ingest
        run: |
          python -m pip install --disable-pip-version-check -r requirements-test.txt
          python -m pip check

      - name: Run telemetry server regression tests
        working-directory: server/telemetry-ingest
        run: python -m unittest discover -s tests -p 'test_*.py'

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows, server]
    runs-on: windows-latest
    environment: code-signing
    permissions:
      contents: write

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Download verified build artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: MSFS-Landing-Stats
          path: artifacts

      - name: Verify tagged release and published client compatibility
        shell: pwsh
        env:
          CERTUM_KEY_ID: ${{ secrets.CERTUM_KEY_ID }}
        run: |
          .\verify-authenticode-build.ps1 -CertificateThumbprint $env:CERTUM_KEY_ID
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          $packagePath = Join-Path $env:GITHUB_WORKSPACE 'artifacts\MSFS-Landing-Stats.exe'
          $updaterPath = Join-Path $env:GITHUB_WORKSPACE 'artifacts\MSFS-Landing-Stats.Updater.exe'
          $assemblyVersion = [Reflection.AssemblyName]::GetAssemblyName($updaterPath).Version
          $builtVersion = "$($assemblyVersion.Major).$($assemblyVersion.Minor).$($assemblyVersion.Build)"
          if ($version -cne $builtVersion) {
            throw "Tag version $version does not match built updater version $builtVersion."
          }
          $channelManifestPath = Join-Path $env:GITHUB_WORKSPACE 'artifacts\update-channel.txt'
          $channelSignaturePath = Join-Path $env:GITHUB_WORKSPACE 'artifacts\update-channel.sig'
          .\verify-issued-update-compatibility.ps1 `
            -ManifestPath $channelManifestPath `
            -PackagePath $packagePath `
            -UpdaterPath $updaterPath `
            -ExpectedVersion $version
          $latest = Invoke-RestMethod 'https://api.github.com/repos/Arderos/msfs24-landing-stats/releases/latest'
          $previousClientVersion = $latest.tag_name -replace '^v', ''
          $parsedPrevious = $null
          if (-not [Version]::TryParse($previousClientVersion, [ref]$parsedPrevious) -or $parsedPrevious -ge [Version]$version) {
            throw 'Published compatibility baseline is not older than the candidate.'
          }
          $previousClientDirectory = Join-Path $env:RUNNER_TEMP "msfs-landing-stats-v$previousClientVersion-client"
          New-Item -ItemType Directory -Path $previousClientDirectory -Force | Out-Null
          $previousClientPath = Join-Path $previousClientDirectory 'MSFS-Landing-Stats.exe'
          $previousClientRoot = "https://github.com/Arderos/msfs24-landing-stats/releases/download/v$previousClientVersion/"
          Invoke-WebRequest -Uri ($previousClientRoot + 'MSFS-Landing-Stats.exe') -OutFile $previousClientPath
          .\verify-previous-client-update.ps1 `
            -PreviousPackagePath $previousClientPath `
            -PreviousVersion $previousClientVersion `
            -ManifestPath $channelManifestPath `
            -SignaturePath $channelSignaturePath `
            -ExpectedVersion $version

          $bridgeVersion = '0.7.6'
          $bridgeManifestPath = Join-Path $env:GITHUB_WORKSPACE 'artifacts\update-manifest.txt'
          $bridgeSignaturePath = Join-Path $env:GITHUB_WORKSPACE 'artifacts\update-manifest.sig'
          if ($version -ceq $bridgeVersion) {
            Copy-Item -LiteralPath $channelManifestPath -Destination $bridgeManifestPath -Force
            Copy-Item -LiteralPath $channelSignaturePath -Destination $bridgeSignaturePath -Force
            $bridgePackagePath = $packagePath
            $bridgeUpdaterPath = $updaterPath
          }
          else {
            $bridgeDirectory = Join-Path $env:RUNNER_TEMP 'msfs-landing-stats-v0.7.6-bridge'
            New-Item -ItemType Directory -Path $bridgeDirectory -Force | Out-Null
            $bridgeRoot = 'https://github.com/Arderos/msfs24-landing-stats/releases/download/v0.7.6/'
            $bridgePackagePath = Join-Path $bridgeDirectory 'MSFS-Landing-Stats.exe'
            $bridgeUpdaterPath = Join-Path $bridgeDirectory 'MSFS-Landing-Stats.Updater.exe'
            Invoke-WebRequest -Uri ($bridgeRoot + 'update-manifest.txt') -OutFile $bridgeManifestPath
            Invoke-WebRequest -Uri ($bridgeRoot + 'update-manifest.sig') -OutFile $bridgeSignaturePath
            Invoke-WebRequest -Uri ($bridgeRoot + 'MSFS-Landing-Stats.exe') -OutFile $bridgePackagePath
            Invoke-WebRequest -Uri ($bridgeRoot + 'MSFS-Landing-Stats.Updater.exe') -OutFile $bridgeUpdaterPath
          }

          .\verify-update-chain.ps1 `
            -BridgeManifestPath $bridgeManifestPath `
            -BridgeSignaturePath $bridgeSignaturePath `
            -BridgePackagePath $bridgePackagePath `
            -BridgeUpdaterPath $bridgeUpdaterPath `
            -ChannelManifestPath $channelManifestPath `
            -ChannelSignaturePath $channelSignaturePath `
            -ChannelPackagePath $packagePath `
            -ChannelUpdaterPath $updaterPath `
            -ExpectedCurrentVersion $version

      - name: Publish tagged release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          $changelog = Get-Content -LiteralPath CHANGELOG.md -Raw
          $escapedVersion = [Regex]::Escape($version)
          $pattern = if ($version -ceq '0.7.6') {
            "(?ms)^## \[$escapedVersion\][^\r\n]*\r?\n(?<body>.*)\z"
          } else {
            "(?ms)^## \[$escapedVersion\][^\r\n]*\r?\n(?<body>.*?)(?=^## \[|\z)"
          }
          $match = [Regex]::Match($changelog, $pattern)
          if (-not $match.Success) {
            throw "CHANGELOG.md does not contain release notes for $version."
          }

          $notesPath = Join-Path $env:RUNNER_TEMP "release-notes-$version.md"
          $match.Groups['body'].Value.Trim() | Set-Content -LiteralPath $notesPath -Encoding utf8
          gh release create $env:GITHUB_REF_NAME `
            artifacts/MSFS-Landing-Stats.exe `
            artifacts/MSFS-Landing-Stats.Updater.exe `
            artifacts/update-manifest.txt `
            artifacts/update-manifest.sig `
            artifacts/update-channel.txt `
            artifacts/update-channel.sig `
            --notes-file $notesPath --draft --verify-tag
          if ($LASTEXITCODE -ne 0) { throw 'Release asset upload failed; refusing publication.' }

          # Existing clients must never see a latest release with only some of
          # its assets uploaded. Publish atomically after checking the draft.
          # The REST by-tag endpoint excludes drafts; gh release view resolves them.
          $releaseId = gh release view $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY --json databaseId --jq .databaseId
          if ($LASTEXITCODE -ne 0 -or -not $releaseId) { throw 'Release draft lookup failed.' }
          $release = gh api "repos/$env:GITHUB_REPOSITORY/releases/$releaseId" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or -not $release.draft) { throw 'Expected an unpublished release draft.' }
          foreach ($name in @('MSFS-Landing-Stats.exe','MSFS-Landing-Stats.Updater.exe',
              'update-manifest.txt','update-manifest.sig','update-channel.txt','update-channel.sig')) {
            $asset = @($release.assets | Where-Object name -CEQ $name)
            $local = Get-Item (Join-Path artifacts $name)
            $digest = 'sha256:' + (Get-FileHash $local.FullName).Hash.ToLowerInvariant()
            if ($asset.Count -ne 1 -or $asset[0].size -ne $local.Length -or $asset[0].digest -cne $digest) {
              throw "Draft release asset verification failed: $name"
            }
          }
          gh release edit $env:GITHUB_REF_NAME --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }
